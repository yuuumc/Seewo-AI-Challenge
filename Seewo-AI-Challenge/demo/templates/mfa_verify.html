{% extends "base.html" %}
{% block title %}MFA 验证{% endblock %}
{% block content %}
<div class="min-h-screen flex items-center justify-center bg-gray-50 py-12 px-4 sm:px-6 lg:px-8">
  <div class="max-w-md w-full space-y-8">
    <div>
      <h2 class="mt-6 text-center text-3xl font-extrabold text-gray-900">
        多因素认证
      </h2>
      <p class="mt-2 text-center text-sm text-gray-600">
        请输入 Google Authenticator 中的 6 位验证码
      </p>
    </div>
    {% if error %}
    <div class="rounded-md bg-red-50 p-4">
      <div class="flex">
        <div class="flex-shrink-0">
          <svg class="h-5 w-5 text-red-400" fill="currentColor" viewBox="0 0 20 20">
            <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM8.707 7.293a1 1 0 00-1.414 1.414L8.586 10l-1.293 1.293a1 1 0 101.414 1.414L10 11.414l1.293 1.293a1 1 0 001.414-1.414L11.414 10l1.293-1.293a1 1 0 00-1.414-1.414L10 8.586 8.707 7.293z" clip-rule="evenodd"/>
          </svg>
        </div>
        <div class="ml-3">
          <p class="text-sm font-medium text-red-800">{{ error }}</p>
        </div>
      </div>
    </div>
    {% endif %}
    <form class="mt-8 space-y-6" method="POST" action="{{ url_for('mfa_verify') }}">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="rounded-md shadow-sm -space-y-px">
        <div>
          <label for="mfa_code" class="sr-only">验证码</label>
          <input id="mfa_code" name="mfa_code" type="text" maxlength="6"
                 required
                 pattern="[0-9]{6}"
                 class="appearance-none rounded-md relative block w-full px-3 py-2 border border-gray-300 placeholder-gray-500 text-gray-900 text-2xl text-center tracking-widest focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 focus:z-10"
                 placeholder="000000"
                 autocomplete="one-time-code"
                 inputmode="numeric">
        </div>
      </div>
      <div>
        <button type="submit"
                class="group relative w-full flex justify-center py-2 px-4 border border-transparent text-sm font-medium rounded-md text-white bg-indigo-600 hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500">
          验证
        </button>
      </div>
      <div class="text-center">
        <a href="{{ url_for('logout') }}" class="text-sm text-gray-500 hover:text-gray-700"
           onclick="document.createElement('form').submit(); return false;">
          返回登录
        </a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
