name: ci

on:
  push:
    branches: [main, develop, feature/**]
  pull_request:
    branches: [main, develop]

env:
  PYTHON_VERSION: "3.11"

jobs:
  # —— P0-7: 阻断 .env.example 提交默认值 ——
  env-safety:
    name: env safety check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check .env.example for default secrets
        run: |
          echo "🔍 Scanning .env.example for forbidden default values..."
          # 禁值清单（与 config.py 的 _FORBIDDEN_SECRET_VALUES 对齐）
          FORBIDDEN=("dev-secret-change-in-prod" "change-me" "seewo-ai-challenge-demo-secret-2026")
          FAIL=0
          for val in "${FORBIDDEN[@]}"; do
            if grep -qF "$val" .env.example; then
              echo "❌ FAIL: .env.example contains forbidden default value: '$val'"
              FAIL=1
            fi
          done
          if [ $FAIL -ne 0 ]; then
            echo "::error::P0-7: .env.example 包含默认密钥占位符，提交前请清空"
            exit 1
          fi
          # FLASK_SECRET_KEY 必须是 KEY=（空值）或 KEY= 占位
          if grep -E "^FLASK_SECRET_KEY=.+$" .env.example | grep -vE "^FLASK_SECRET_KEY=$" | grep -vE "^FLASK_SECRET_KEY=\s*#"; then
            echo "❌ FAIL: .env.example 的 FLASK_SECRET_KEY 必须为空值"
            exit 1
          fi
          echo "✅ .env.example 安全检查通过"

  # —— 1. 静态检查（最快，先跑） ——
  # Week 2 Day 1-2 升级（CI 教训 9 fail 根因，全栈代码审查官独立 PR）：
  #   - 显式 --select 规则集（F/E/W/N/B），不依赖 ruff 默认
  #   - 加启动期 import smoke：把 import-time NameError 前置到 lint 阶段
  #   - 加 pytest pre-collect：test 文件的 import 错误也前置
  #   - 缓存 pip 装好的 deps 给后续 job 复用
  lint:
    name: ruff lint + import smoke
    runs-on: ubuntu-latest
    needs: env-safety
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install ruff
        run: pip install ruff==0.6.9
      - name: Ruff check (F/E/W/N/B 显式规则集)
        run: |
          ruff check demo/ infra/ \
            --select F,E,W,N,B \
            --ignore N999 \
            --output-format=github \
            --statistics
      - name: Install all deps (启动期 smoke 前置)
        run: pip install -r requirements.txt -r requirements-fastapi.txt
      - name: Import smoke (CI 教训 9 fail 根因修复)
        run: |
          python -c "import demo.app; print('✅ demo.app imports cleanly')"
          python -c "import demo.fastapi_app.main; print('✅ demo.fastapi_app.main imports cleanly')"
          python -c "import infra.celery.tasks; print('✅ infra.celery.tasks imports cleanly')"
          python -c "import infra.celery.tasks_llm; print('✅ infra.celery.tasks_llm imports cleanly')"
      - name: Pytest pre-collect check (test 文件 import 错误前置)
        run: |
          pytest --collect-only -q demo/tests/ demo/fastapi_app/tests/ || {
            echo "::error::Pytest collect 失败 — test 文件存在 import-time 错误";
            exit 1;
          }

  # —— 2. 老 Flask 单测（保护 78/78 基线） ——
  test-flask:
    name: Flask unit tests (legacy)
    runs-on: ubuntu-latest
    needs: env-safety
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: seewo_test
          POSTGRES_USER: seewo
          POSTGRES_PASSWORD: seewo
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://seewo:seewo@localhost:5432/seewo_test
      DATABASE_URL_SYNC: postgresql+psycopg2://seewo:seewo@localhost:5432/seewo_test
      REDIS_URL: redis://localhost:6379/0
      CELERY_BROKER_URL: redis://localhost:6379/1
      CELERY_RESULT_BACKEND: redis://localhost:6379/2
      FLASK_SECRET_KEY: test-secret-key-not-for-prod-32-bytes-min
      SEEWO_DEMO_MODE: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install deps
        run: pip install -r requirements.txt -r requirements-fastapi.txt
      - name: Run Flask unit tests
        run: pytest demo/tests/ -v --tb=short --maxfail=10

  # —— 3. 新 FastAPI 测试（Week 1 起步，逐步补全） ——
  test-fastapi:
    name: FastAPI integration tests
    runs-on: ubuntu-latest
    needs: env-safety
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: seewo_test
          POSTGRES_USER: seewo
          POSTGRES_PASSWORD: seewo
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    env:
      DATABASE_URL: postgresql+asyncpg://seewo:seewo@localhost:5432/seewo_test
      REDIS_URL: redis://localhost:6379/0
      FLASK_SECRET_KEY: test-secret-key-not-for-prod-32-bytes-min
      SEEWO_DEMO_MODE: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install deps
        run: pip install -r requirements.txt -r requirements-fastapi.txt
      - name: Run Alembic migrations
        run: alembic -c infra/pg/alembic.ini upgrade head
      - name: Run FastAPI tests
        run: pytest demo/fastapi_app/tests/ -v --tb=short || echo "::warning::FastAPI tests not yet implemented (Week 3 补全)"

  # —— 4. 镜像构建（仅 main，验证 Dockerfile 可用） ——
  build:
    name: Docker build
    runs-on: ubuntu-latest
    needs: [env-safety, lint, test-flask]
    if: github.ref == 'refs/heads/main' || github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t seewo-api:phase1-${{ github.sha }} -f Dockerfile .
      - name: Check image size
        run: |
          SIZE_BYTES=$(docker image inspect seewo-api:phase1-${{ github.sha }} --format='{{.Size}}')
          SIZE_MB=$((SIZE_BYTES / 1024 / 1024))
          echo "Image size: ${SIZE_MB}MB"
          if (( SIZE_MB > 500 )); then
            echo "::error::Image size ${SIZE_MB}MB exceeds 500MB target"
            exit 1
          fi
