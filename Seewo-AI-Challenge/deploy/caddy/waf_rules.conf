# waf_rules.conf — V2.0 Sprint 7 (7.4): 独立 WAF 规则配置
# Caddy 层 WAF 规则，可在 Caddyfile 中通过 import 引入：
#   import waf_rules.conf
#
# 规则分类：
#   1. SQL 注入检测 (URL path + query string)
#   2. XSS 检测 (URL path + query string)
#   3. 路径遍历检测 (URL path)
#   4. 请求体大小限制 (10MB)
#
# 命中规则返回 403 并关闭连接。
# Flask 层 waf_middleware.py 作为第二道防线（纵深防御）。

# ── 1. SQL 注入检测 ──────────────────────────────────────────────────────
@sql_injection {
	path_regexp sql_injection "(?i)(union.*select|drop.*table|insert.*into.*values|delete.*from|update.*set|--$|/\*.*\*/|;.*(drop|delete|update|insert|alter|create)|or.*1=1|and.*1=1|information_schema|benchmark\(|sleep\(|waitfor.*delay|xp_cmdshell|load_file\(|into.*outfile)"
	query sql_injection_query "(?i)(union.*select|drop.*table|insert.*into|delete.*from|or.*1=1|and.*1=1|information_schema|benchmark\(|sleep\(|xp_cmdshell)"
}
respond @sql_injection 403 {
	close
}

# ── 2. XSS 检测 ─────────────────────────────────────────────────────────
@xss_attack {
	path_regexp xss_path "(?i)(<script|javascript:|on(error|load|click|mouseover)=|<iframe|<object|<embed|<svg.*on|<img.*onerror|document\.cookie|document\.write|eval\()"
	query xss_query "(?i)(<script|javascript:|on(error|load|click)=|<iframe|document\.cookie|eval\()"
}
respond @xss_attack 403 {
	close
}

# ── 3. 路径遍历检测 ─────────────────────────────────────────────────────
@path_traversal {
	path_regexp traversal "(\.\./|\.\.\\|%2e%2e|%2e%2e%2f|\.\.%2f|\.\.%5c|\.\.%00)"
}
respond @path_traversal 403 {
	close
}

# ── 4. 请求体大小限制 10MB ──────────────────────────────────────────────
request_body {
	max_size 10MB
}
